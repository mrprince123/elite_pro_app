<!DOCTYPE html>

                        "primary-fixed": "#d8e2ff",
                        "inverse-surface": "#313032",
                        "inverse-on-surface": "#f4eff2",
                        "secondary-fixed": "#89fa9b",

                        "primary-fixed-dim": "#adc6ff",
                        "on-tertiary-container": "#fffbff",
                        "primary-container": "#2771df",
                        "secondary-container": "#86f898",
                        "on-secondary": "#ffffff",
                        "tertiary": "#765700",
                        "surface-bright": "#fdf8fb",
                        "surface-container-lowest": "#ffffff",
                        "outline": "#727785",
                        "primary": "#0058bd",
                        "surface-variant": "#E1E2EC",
                        "on-background": "#1c1b1d",

                        "surface-container": "#f1edef",
                        "on-error": "#ffffff",

                        "on-tertiary-fixed": "#261a00",

                        "secondary": "#006e2c",
                        "surface-container-high": "#ebe7e9",
                        "surface-dim": "#ddd9db",
                        "error": "#ba1a1a",
                        "tertiary-container": "#956e00",
                        "surface": "#fdf8fb",
                        "surface-container-highest": "#e6e1e4",
                        "activity-green": "#34A853",
                        "activity-blue": "#4285F4"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",

                    },
                    "spacing": {

                        "unit": "8px",

                    "fontFamily": {

                        "body-lg": ["Inter"],

                }

    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        .progress-shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .entrance-fade {
            opacity: 0;
            animation: entrance 1s ease-out forwards;
        }
        @keyframes entrance {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .bg-animated-gradient {
            background: linear-gradient(-45deg, #fdf8fb, #d8e2ff, #f7f2f5, #adc6ff);
            background-size: 400% 400%;
            animation: gradient-flow 15s ease infinite;
        }
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="bg-animated-gradient text-on-surface flex flex-col items-center justify-center min-h-screen overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Canvas centered perfectly -->
<main class="flex flex-col items-center justify-center w-full max-w-md px-margin-mobile space-y-12">
<!-- Brand Identity Section -->
<div class="entrance-fade flex flex-col items-center space-y-6" style="animation-delay: 0.2s;">
<!-- Icon Wrapper -->
<div class="relative flex items-center justify-center w-24 h-24 bg-surface-container-highest/60 backdrop-blur-sm rounded-m3-card shadow-lg border border-white/20">
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="favorite" style="font-variation-settings: 'FILL' 1;">favorite</span>
<!-- Subtle pulsing ring effect -->
<div class="absolute inset-0 rounded-m3-card border-2 border-primary/20 animate-ping opacity-75"></div>
</div>
<!-- Brand Typography -->
<div class="text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary tracking-tight">Vitality Core</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1 font-medium">Your health, precision-engineered.</p>
</div>
</div>
<!-- Centered Loading Indicator Section -->
<div class="w-full entrance-fade" style="animation-delay: 0.5s;">
<div class="flex flex-col items-center space-y-4">
<!-- Loading Message -->
<span class="font-label-lg text-label-lg text-on-surface-variant transition-opacity duration-300 font-medium" id="loading-text">
                Optimizing your fitness data
            </span>
<!-- Progress Bar Container -->
<div class="relative w-full h-1.5 bg-surface-container-highest/50 rounded-full overflow-hidden backdrop-blur-sm border border-white/10">
<div class="absolute top-0 left-0 h-full bg-primary rounded-full transition-all duration-700 ease-out shadow-[0_0_8px_rgba(0,88,189,0.4)]" id="progress-bar" style="width: 5%;">
<div class="progress-shimmer w-full h-full"></div>
</div>
</div>
</div>
</div>
</main>
<!-- Atmosphere / Background Overlay Elements -->
<div class="fixed inset-0 pointer-events-none -z-10">
<!-- Overlay for better text legibility -->
<div class="absolute inset-0 bg-white/10 backdrop-blur-[1px]"></div>
<!-- Soft tonal gradient for depth -->
<div class="absolute top-0 left-0 w-full h-full bg-[radial-gradient(circle_at_center,_transparent_0%,_rgba(255,255,255,0.2)_100%)]"></div>
</div>
<!-- Micro-interactions Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const progressBar = document.getElementById('progress-bar');
        const loadingText = document.getElementById('loading-text');
        
        const stages = [
            { width: '25%', text: 'Syncing biometrics...' },
            { width: '55%', text: 'Analyzing activity trends...' },
            { width: '85%', text: 'Generating daily goals...' },
            { width: '100%', text: 'Ready to move.' }
        ];

        let stageIndex = 0;

        const updateProgress = () => {
            if (stageIndex < stages.length) {
                const stage = stages[stageIndex];
                progressBar.style.width = stage.width;
                
                // Fade out text, change, fade in
                loadingText.style.opacity = '0';
                setTimeout(() => {
                    loadingText.innerText = stage.text;
                    loadingText.style.opacity = '1';
                }, 300);

                stageIndex++;
                
                // Progressive timing for realistic feel
                const nextDelay = 800 + Math.random() * 1200;
                if (stageIndex < stages.length) {
                    setTimeout(updateProgress, nextDelay);
                }
            }
        };

        // Start simulation after initial entrance
        setTimeout(updateProgress, 1200);
    });
</script>
</body></html>
